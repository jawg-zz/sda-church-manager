{% extends "base.html" %}
{% block content %}
<div class="page-header"><h1><i class="bi bi-book me-2"></i>{% if cls %}Edit Class{% else %}New Class{% endif %}</h1></div>
<div class="card">
    <div class="card-body">
        <form method="post">
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label">Class Name *</label>
                    <input type="text" name="name" class="form-control" required value="{{ cls.name if cls else '' }}">
                </div>
                <div class="col-md-6">
                    <label class="form-label">Teacher</label>
                    <input type="text" name="teacher" class="form-control" value="{{ cls.teacher if cls else '' }}">
                </div>
                <div class="col-12">
                    <label class="form-label">Description</label>
                    <textarea name="description" class="form-control" rows="3">{{ cls.description if cls else '' }}</textarea>
                </div>
                <div class="col-12">
                    <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> Save</button>
                    <a href="/sabbath-school" class="btn btn-outline-secondary">Cancel</a>
                </div>
            </div>
        </form>
    </div>
</div>
{% endblock %}
