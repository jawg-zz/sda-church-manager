{% extends "base.html" %}
{% block content %}
<div class="page-header d-flex justify-content-between align-items-center">
    <h1><i class="bi bi-building me-2"></i>Churches</h1>
    <a href="/auth/churches/add" class="btn btn-primary btn-sm"><i class="bi bi-plus-lg"></i> Add Church</a>
</div>
<div class="card">
    <div class="card-body p-0">
        <div class="table-responsive">
            <table class="table table-dark table-hover mb-0">
                <thead><tr><th>Name</th><th>Location</th><th>District</th><th>Region</th><th>Members</th><th></th></tr></thead>
                <tbody>
                    {% for c in churches %}
                    <tr>
                        <td><strong>{{ c.name }}</strong></td>
                        <td>{{ c.location or '-' }}</td>
                        <td>{{ c.district or '-' }}</td>
                        <td>{{ c.region or '-' }}</td>
                        <td>{{ c.members | length }}</td>
                        <td>
                            <a href="/auth/churches/edit/{{ c.id }}" class="btn btn-sm btn-outline-primary"><i class="bi bi-pencil"></i></a>
                        </td>
                    </tr>
                    {% else %}
                    <tr><td colspan="6" class="text-center text-secondary py-4">No churches yet</td></tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
