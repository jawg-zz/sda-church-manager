# Build Docker image for linux/arm64, push to GHCR, then trigger Dokploy deploy
#
# Works for ANY repo — just copy this file into .github/workflows/ and set these secrets:
#   DOKPLOY_URL        - https://main.spidmax.win
#   DOKPLOY_API_KEY    - your Dokploy API token
#   DOKPLOY_COMPOSE_ID - the compose app ID in Dokploy
#
# GITHUB_TOKEN is auto-provided with write:packages scope — no PAT needed.

name: Build & Deploy

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (multi-arch)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha_short }}
          platforms: linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Dokploy deploy
        run: |
          curl -s -X POST "${{ secrets.DOKPLOY_URL }}/api/compose.deploy" \
            -H "x-api-key: ${{ secrets.DOKPLOY_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"composeId":"${{ secrets.DOKPLOY_COMPOSE_ID }}"}'
