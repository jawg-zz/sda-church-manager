services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - "5000"
    environment:
      - TZ=Africa/Nairobi
      - FLASK_ENV=production
      - DATABASE_URL=sqlite:///church.db
      - SECRET_KEY=${SECRET_KEY:-change-this-in-production}
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "256M"
        reservations:
          cpus: "0.1"
          memory: "64M"
      restart_policy:
        condition: unless-stopped
        delay: 5s
