{% extends "base.html" %}
{% block content %}
<div class="page-header">
    <h1><i class="bi bi-arrow-left-right me-2"></i>Transfer Member</h1>
</div>
<div class="card">
    <div class="card-body">
        <div class="alert alert-info">
            <i class="bi bi-info-circle me-2"></i>
            You are transferring <strong>{{ member.full_name }}</strong> from the current church to another church.
        </div>
        <form method="post">
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label">Target Church *</label>
                    <select name="target_church_id" class="form-select" required>
                        <option value="">-- Select Church --</option>
                        {% for c in churches %}
                        <option value="{{ c.id }}">{{ c.name }}{% if c.location %} — {{ c.location }}{% endif %}</option>
                        {% endfor %}
                    </select>
                    {% if not churches %}
                    <small class="text-secondary">No other churches available for transfer.</small>
                    {% endif %}
                </div>
                <div class="col-md-6">
                    <label class="form-label">Transfer Date</label>
                    <input type="date" name="transfer_date" class="form-control" value="">
                </div>
                <div class="col-12">
                    <label class="form-label">Reason for Transfer</label>
                    <textarea name="reason" class="form-control" rows="3" placeholder="Optional reason for the transfer..."></textarea>
                </div>
                <div class="col-12">
                    <button type="submit" class="btn btn-warning" onclick="return confirm('Are you sure you want to transfer {{ member.full_name }}? This action will move the member to another church.')">
                        <i class="bi bi-arrow-left-right"></i> Transfer Member
                    </button>
                    <a href="/members/view/{{ member.id }}" class="btn btn-outline-secondary">Cancel</a>
                </div>
            </div>
        </form>
    </div>
</div>
{% endblock %}
