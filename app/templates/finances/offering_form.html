{% extends "base.html" %}
{% block content %}
<div class="page-header"><h1><i class="bi bi-gift me-2"></i>{% if offering %}Edit Offering{% else %}Record Offering{% endif %}</h1></div>
<div class="card">
    <div class="card-body">
        <form method="post">
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label">Member (optional)</label>
                    <select name="member_id" class="form-select">
                        <option value="">-- Anonymous / General --</option>
                        {% for m in members %}
                        <option value="{{ m.id }}" {% if offering and offering.member_id == m.id %}selected{% endif %}>{{ m.full_name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Amount (KES) *</label>
                    <input type="number" name="amount" class="form-control" step="0.01" min="0" required value="{{ offering.amount if offering else '' }}">
                </div>
                <div class="col-md-3">
                    <label class="form-label">Date *</label>
                    <input type="date" name="date" class="form-control" required value="{{ offering.date if offering else current_date }}">
                </div>
                <div class="col-md-6">
                    <label class="form-label">Category *</label>
                    <select name="category" class="form-select" required>
                        <option value="">-- Select --</option>
                        {% for cat in ['Sabbath School','Church Budget','Building Fund','Mission','Youth','Welfare','Education','Community Outreach','Other'] %}
                        <option value="{{ cat }}" {% if offering and offering.category == cat %}selected{% endif %}>{{ cat }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-12">
                    <label class="form-label">Notes</label>
                    <textarea name="notes" class="form-control" rows="2">{{ offering.notes if offering else '' }}</textarea>
                </div>
                <div class="col-12">
                    <button type="submit" class="btn btn-success"><i class="bi bi-check-lg"></i> Save</button>
                    <a href="/finances" class="btn btn-outline-secondary">Cancel</a>
                </div>
            </div>
        </form>
    </div>
</div>
{% endblock %}
